name: Nudge release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0) — used as the tag v<version>'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: nudge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version + tag
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION} (tag: ${TAG})"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Import Developer ID certificate
        id: cert
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${BUILD_CERTIFICATE_BASE64}" ]]; then
            echo "::error::BUILD_CERTIFICATE_BASE64 secret is not set."
            exit 1
          fi
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KC="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "${BUILD_CERTIFICATE_BASE64}" | base64 --decode > "${CERT_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KC}"
          security set-keychain-settings -lut 21600 "${KC}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KC}"
          security import "${CERT_PATH}" -P "${P12_PASSWORD}" -A -t cert -f pkcs12 -k "${KC}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KC}" >/dev/null
          security list-keychain -d user -s "${KC}" $(security list-keychain -d user | tr -d '"')

          echo "Identities found in the uploaded .p12:"
          security find-identity -p codesigning -v "${KC}"

          # Fail-fast gate: the .p12 MUST contain a Developer ID Application identity.
          if ! security find-identity -p codesigning -v "${KC}" | grep -q "Developer ID Application"; then
            echo "::error::The BUILD_CERTIFICATE_BASE64 secret does NOT contain a 'Developer ID Application' certificate."
            echo "::error::It contains the identity listed above instead. Re-export from Keychain Access:"
            echo "::error::  login keychain -> My Certificates -> right-click the row starting with 'Developer ID Application:' -> Export."
            exit 1
          fi
          echo "::notice::Developer ID Application certificate confirmed in keychain."

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project boringNotch.xcodeproj

      - name: Archive (Developer ID signed)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEVELOPMENT_TEAM_ID: ${{ vars.DEVELOPMENT_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${DEVELOPMENT_TEAM_ID}" ]]; then
            echo "::error::DEVELOPMENT_TEAM_ID variable is not set (repo Settings -> Variables)."
            exit 1
          fi
          xcodebuild archive \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/Nudge.xcarchive \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="${DEVELOPMENT_TEAM_ID}" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}"

      - name: Locate built app
        id: app
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Nudge.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n 1)
          if [[ -z "${APP_PATH}" ]]; then
            echo "::error::No .app found in archive"
            exit 1
          fi
          echo "app_path=${APP_PATH}" >> "$GITHUB_OUTPUT"
          echo "Found: ${APP_PATH}"

      - name: Rename to Nudge.app
        id: rename
        env:
          APP_PATH: ${{ steps.app.outputs.app_path }}
        run: |
          set -euo pipefail
          DIR="$(dirname "${APP_PATH}")"
          DEST="${DIR}/Nudge.app"
          if [[ "${APP_PATH}" != "${DEST}" ]]; then
            mv "${APP_PATH}" "${DEST}"
          fi
          echo "app_path=${DEST}" >> "$GITHUB_OUTPUT"
          echo "Renamed to: ${DEST}"

      - name: Sign nested binaries xcodebuild missed
        env:
          APP_PATH: ${{ steps.rename.outputs.app_path }}
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -p codesigning -v | awk -F'"' '/Developer ID Application/{print $2; exit}')
          echo "Signing nested code with: ${IDENTITY}"

          # Preserve the main app's resolved entitlements for the final re-sign
          # (so com.apple.security.network.client survives — ntfy.sh needs it).
          codesign -d --entitlements - --xml "${APP_PATH}" \
            > "$RUNNER_TEMP/main.entitlements" 2>/dev/null || true

          # xcodebuild signs the main app + normal frameworks, but misses
          # prebuilt-dependency stragglers: Sparkle's deeply-nested Updater.app
          # and the mediaremote-adapter test-client binary (copied as a plain
          # resource). Sign every nested bundle/dylib inside-out (deepest path
          # first) so each gets a Developer ID signature + hardened runtime +
          # secure timestamp — the three things the notary checks.
          find "${APP_PATH}/Contents" \
            \( -name "*.dylib" -o -name "*.xpc" -o -name "*.app" -o -name "*.framework" \) -print \
            | awk '{ print length, $0 }' | sort -rn | cut -d" " -f2- \
            | while IFS= read -r item; do
                echo "  signing ${item}"
                codesign --force --options runtime --timestamp --sign "${IDENTITY}" "${item}"
              done

          # Loose executable Mach-O files copied into Resources (test clients).
          find "${APP_PATH}/Contents/Resources" -type f -perm -u+x -print 2>/dev/null \
            | while IFS= read -r f; do
                if file "${f}" | grep -q "Mach-O"; then
                  echo "  signing ${f}"
                  codesign --force --options runtime --timestamp --sign "${IDENTITY}" "${f}"
                fi
              done

          # Finally re-seal the outer app, restoring its entitlements.
          if [[ -s "$RUNNER_TEMP/main.entitlements" ]]; then
            codesign --force --options runtime --timestamp \
              --entitlements "$RUNNER_TEMP/main.entitlements" \
              --sign "${IDENTITY}" "${APP_PATH}"
          else
            codesign --force --options runtime --timestamp \
              --sign "${IDENTITY}" "${APP_PATH}"
          fi
          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"

      - name: Zip (for notarization)
        id: zip_pre
        env:
          APP_PATH: ${{ steps.rename.outputs.app_path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ZIP_NAME="Nudge-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "dist/${ZIP_NAME}"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          ls -lah dist/

      - name: Notarize with Apple
        env:
          ZIP_NAME: ${{ steps.zip_pre.outputs.zip_name }}
          APPLE_ID_EMAIL: ${{ secrets.APPLE_ID_EMAIL }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_ID_EMAIL}" || -z "${APPLE_ID_PASSWORD}" || -z "${APPLE_TEAM_ID}" ]]; then
            echo "::error::APPLE_ID_EMAIL / APPLE_ID_PASSWORD / APPLE_TEAM_ID secrets missing"
            exit 1
          fi
          SUBMIT_JSON=$(xcrun notarytool submit "dist/${ZIP_NAME}" \
            --apple-id "${APPLE_ID_EMAIL}" \
            --password "${APPLE_ID_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait --timeout 20m \
            --output-format json)
          echo "${SUBMIT_JSON}"
          SUBMISSION_ID=$(echo "${SUBMIT_JSON}" | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          STATUS=$(echo "${SUBMIT_JSON}" | python3 -c 'import sys,json; print(json.load(sys.stdin)["status"])')
          echo "Submission ${SUBMISSION_ID} status: ${STATUS}"
          # notarytool submit --wait exits 0 even when status is Invalid, so check explicitly.
          if [[ "${STATUS}" != "Accepted" ]]; then
            echo "::error::Notarization ${STATUS}. Apple's detailed log:"
            xcrun notarytool log "${SUBMISSION_ID}" \
              --apple-id "${APPLE_ID_EMAIL}" \
              --password "${APPLE_ID_PASSWORD}" \
              --team-id "${APPLE_TEAM_ID}" \
              || true
            exit 1
          fi

      - name: Staple ticket onto the app
        env:
          APP_PATH: ${{ steps.rename.outputs.app_path }}
        run: |
          set -euo pipefail
          xcrun stapler staple "${APP_PATH}"
          xcrun stapler validate "${APP_PATH}"
          spctl --assess --type execute --verbose=2 "${APP_PATH}"

      - name: Re-zip after stapling
        id: zip
        env:
          APP_PATH: ${{ steps.rename.outputs.app_path }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP_NAME: ${{ steps.zip_pre.outputs.zip_name }}
        run: |
          set -euo pipefail
          rm "dist/${ZIP_NAME}"
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "dist/${ZIP_NAME}"
          (cd dist && shasum -a 256 "${ZIP_NAME}" > "${ZIP_NAME}.sha256")
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          ls -lah dist/

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ZIP_NAME: ${{ steps.zip.outputs.zip_name }}
        run: |
          set -euo pipefail
          SHA=$(awk '{print $1}' "dist/${ZIP_NAME}.sha256")
          NOTES_FILE="dist/release-notes.md"
          cat > "${NOTES_FILE}" <<EOF
          Internal Nudge build for Ontora. Signed with Max's Developer ID
          and notarized by Apple — double-click and it opens.

          ## Install (Leon / David)

          1. Download \`${ZIP_NAME}\` below.
          2. Unzip and drag \`Nudge.app\` into \`/Applications\`.
          3. Double-click \`Nudge.app\` to launch.
          4. Pick your name on first launch and grant notification permission.

          ## Verify download integrity

          \`\`\`bash
          shasum -a 256 ${ZIP_NAME}
          # expected:
          # ${SHA}  ${ZIP_NAME}
          \`\`\`

          Built from commit \`${{ github.sha }}\` on macOS runner.
          EOF
          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP_NAME: ${{ steps.zip.outputs.zip_name }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          set -euo pipefail
          if ! git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            git tag "${TAG}"
            git push origin "${TAG}"
          fi
          gh release create "${TAG}" \
            "dist/${ZIP_NAME}" \
            "dist/${ZIP_NAME}.sha256" \
            --title "Nudge ${VERSION}" \
            --notes-file "${NOTES_FILE}"
