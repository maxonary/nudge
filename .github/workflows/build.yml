name: Build

# PR build check + downloadable artifact. Releases are handled separately
# (auto-release.yml on merge to main → nudge-release.yml). No nightly.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Nudge (unsigned)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Nudge.xcodeproj

      - name: Build (Release, unsigned)
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
        run: |
          xcodebuild \
            -project Nudge.xcodeproj \
            -scheme Nudge \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            KLIPY_API_KEY="${KLIPY_API_KEY}" \
            build

      - name: Package app
        id: package
        run: |
          APP_PATH="build/Build/Products/Release/Nudge.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Nudge.app not found at $APP_PATH"; exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          ZIP_NAME="Nudge-${SHORT_SHA}.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_NAME"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nudge-app
          path: ${{ steps.package.outputs.zip_name }}
          if-no-files-found: error
          retention-days: 14
