name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Nudge (unsigned)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Nudge.xcodeproj

      - name: Build (Release, unsigned)
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
        run: |
          xcodebuild \
            -project Nudge.xcodeproj \
            -scheme Nudge \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            KLIPY_API_KEY="${KLIPY_API_KEY}" \
            build

      - name: Package app
        id: package
        run: |
          APP_PATH="build/Build/Products/Release/Nudge.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Nudge.app not found at $APP_PATH"; exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          ZIP_NAME="Nudge-${SHORT_SHA}.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_NAME"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nudge-app
          path: ${{ steps.package.outputs.zip_name }}
          if-no-files-found: error
          retention-days: 14

      # On merge to main, publish/refresh a rolling "nightly" pre-release.
      - name: Publish nightly pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly (main)
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Automated unsigned build from the latest `main` (${{ github.sha }}).

            ⚠️ Unsigned: on first launch, right-click the app → Open (or allow it
            in System Settings → Privacy & Security) to bypass Gatekeeper.
          files: ${{ steps.package.outputs.zip_name }}
